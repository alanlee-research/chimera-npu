# Chimera-Proto (earlier design, SiLU): SPD downsampling and three-branch context block; uses modules_proto.py.
nc: 4
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0  P1/2   16 ch
  - [-1, 1, Conv, [128, 3, 2]]         # 1  P2/4   32 ch
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2  P2     64 ch
  - [-1, 1, Conv, [256, 3, 2]]         # 3  P3/8   64 ch
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4  P3     128 ch
  - [-1, 1, Conv, [512, 3, 2]]         # 5  P4/16  128 ch
  - [-1, 2, C3k2, [512, True]]         # 6  P4     128 ch
head:
  - [-1, 1, SPPF, [512, 5]]                      # 7  128 ch
  - [-1, 1, DilatedContext, [128]]               # 8  three-branch context block (d = 1, 2, 4)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9  128 ch @P3
  - [2, 1, SPDDown, [64]]                        # 10 64 ch  @P3
  - [[4, 10], 1, Concat, [1]]                    # 11 128 + 64 = 192 ch
  - [-1, 1, HFGate, [128, 64]]                   # 12 192 ch
  - [[-1, 9], 1, Concat, [1]]                    # 13 192 + 128 = 320 ch
  - [-1, 2, C3k2, [512, False]]                  # 14 128 ch (P3 head input, no squeeze)
  - [-1, 1, Conv, [512, 3, 2]]                   # 15 128 ch @P4
  - [[-1, 8], 1, Concat, [1]]                    # 16 128 + 128 = 256 ch
  - [-1, 2, C3k2, [512, False]]                  # 17 128 ch (P4 head input)
  - [[14, 17], 1, Detect, [nc]]                  # 18 Detect(P3, P4)
