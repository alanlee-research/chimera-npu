# Chimera-SiLU (same architecture as Chimera-LReLU, SiLU activation): YOLO11n backbone up to P4, no P5 stage, MDRF context at P4,
# HFGate from P2 to P3, heads at strides 8 and 16. Input 832x480, 4 classes.
nc: 4
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0  P1/2   16 ch
  - [-1, 1, Conv, [128, 3, 2]]         # 1  P2/4   32 ch
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2  P2     64 ch (120x208)
  - [-1, 1, Conv, [256, 3, 2]]         # 3  P3/8   64 ch
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4  P3    128 ch (60x104)
  - [-1, 1, Conv, [512, 3, 2]]         # 5  P4/16 128 ch
  - [-1, 2, C3k2, [512, True]]         # 6  P4    128 ch (30x52)
head:
  - [-1, 1, SPPF, [512, 5]]                      # 7  128 ch @P4
  - [-1, 1, DilatedContextSlim, [128]]           # 8  MDRF, 128 ch @P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9  128 ch @P3
  - [2, 1, Conv, [256, 3, 2]]                    # 10 F2_down: 3x3 s2 from P2, 64 ch @P3
  - [[4, 10], 1, Concat, [1]]                    # 11 [F3 | F2_down] = 192 ch
  - [-1, 1, HFGate, [128, 64]]                   # 12 192 ch
  - [[-1, 9], 1, Concat, [1]]                    # 13 + upsampled context = 320 ch
  - [-1, 2, C3k2, [512, False]]                  # 14 P3 fusion, 128 ch
  - [-1, 1, Conv, [256, 1, 1]]                   # 15 1x1 squeeze to 64 ch (P3 head input)
  - [14, 1, Conv, [512, 3, 2]]                   # 16 128 ch @P4
  - [[-1, 8], 1, Concat, [1]]                    # 17 256 ch @P4
  - [-1, 2, C3k2, [512, False]]                  # 18 128 ch (P4 head input)
  - [[15, 18], 1, Detect, [nc]]                  # 19 Detect at strides 8 and 16
